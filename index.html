<!doctype html>
<html lang="tr">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arkonas Panel</title>
<link rel="icon" href="assets/arkonas-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.556.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  --ground: oklch(0.135 0.04 264.7);
  --ground-deep: oklch(0.112 0.034 265);
  --well: oklch(0.098 0.03 265);
  --hover: oklch(1 0 0 / 0.04);
  --select: oklch(1 0 0 / 0.07);
  --line: oklch(1 0 0 / 0.10);
  --line-strong: oklch(1 0 0 / 0.18);
  --ink: oklch(0.94 0.012 252);
  --ink-2: oklch(0.87 0.02 254);
  --ink-3: oklch(0.80 0.03 256.8);
  --ink-4: oklch(0.72 0.035 257);
  --cyan: oklch(0.865 0.127 207);
  --cyan-top: #34d8ff;
  --cyan-bottom: #08a8df;
  --cyan-lip: #067ca8;
  --cyan-ink: #03131b;
  --ok: oklch(0.85 0.12 164);
  --warn: oklch(0.86 0.12 80);
  --bad: oklch(0.76 0.14 22);
  --idle: oklch(0.70 0.03 256);
  --r-s: 6px;
  --r-m: 8px;
  --r-l: 12px;
  --rail: 256px;
  --rail-collapsed: 64px;
  --top: 56px;
  --f-ui: "Geist", system-ui, sans-serif;
  --f-display: "Outfit", "Geist", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ground);
  color: var(--ink-2);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.55;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
  caret-color: var(--cyan);
}
::selection { background: oklch(0.80 0.13 215 / 0.35); color: var(--ink); }
* { scrollbar-width: thin; scrollbar-color: oklch(1 0 0 / 0.16) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: oklch(1 0 0 / 0.14); border-radius: var(--r-m); border: 3px solid transparent; background-clip: padding-box; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: var(--r-s); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: var(--ink); }
svg.lucide { width: 15px; height: 15px; stroke-width: 1.75; flex: none; }
.mono { font-family: var(--f-mono); font-size: 0.93em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-4); }

.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.app.is-collapsed { grid-template-columns: var(--rail-collapsed) minmax(0, 1fr); }

.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--ground-deep); border-right: 1px solid var(--line); z-index: 20; }
.rail-head { display: flex; align-items: center; gap: 10px; height: var(--top); padding: 0 12px 0 14px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { width: 30px; height: 28px; object-fit: contain; }
.brand-word { display: grid; line-height: 1.1; }
.brand-word b { font-family: var(--f-display); font-weight: 700; letter-spacing: 0.2em; font-size: 13px; color: var(--ink); }
.brand-word span { font-size: 11px; color: var(--ink-4); }
.rail-toggle { margin-left: auto; background: none; border: 0; color: var(--ink-4); width: 28px; height: 28px; border-radius: var(--r-s); display: grid; place-items: center; }
.rail-toggle:hover { color: var(--ink); background: var(--hover); }
.rail-body { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
.rail-sep { height: 1px; background: var(--line); margin: 10px 6px; }
.rail-label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 14px 8px 6px; }
.rail-sublabel { font-size: 12px; color: var(--ink-4); padding: 10px 8px 4px; }
.grp-toggle { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 0 8px; border: 0; border-radius: var(--r-s); background: none; color: var(--ink-2); font-size: 14px; font-weight: 500; text-align: left; }
.grp-toggle:hover { background: var(--hover); color: var(--ink); }
.grp-toggle svg.lucide { width: 14px; height: 14px; color: var(--ink-4); transition: transform 0.15s var(--ease-out); }
.grp-toggle[aria-expanded="true"] svg.lucide { transform: rotate(90deg); }
.grp-toggle .lbl { flex: 1; }
.grp-toggle .aux { font-size: 12.5px; color: var(--ink-4); font-weight: 400; }
.grp-toggle.has-cur[aria-expanded="false"] { color: var(--cyan); }
.item.sub { padding-left: 30px; }
.is-collapsed .grp-toggle .lbl, .is-collapsed .grp-toggle .aux { display: none; }
.is-collapsed .item.sub { padding-left: 0; }

.item { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 8px; border-radius: var(--r-s); color: var(--ink-2); font-weight: 500; position: relative; width: 100%; background: none; border: 0; text-align: left; font-size: 14.5px; }
.item:hover { color: var(--ink); background: var(--hover); }
.item[aria-current="page"], .item[aria-selected="true"] { color: var(--ink); background: oklch(0.865 0.127 207 / 0.12); font-weight: 600; }
.item[aria-current="page"]::before, .item[aria-selected="true"]::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px; border-radius: 0 2px 2px 0; background: var(--cyan); }
.item .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .aux { font-size: 13px; color: var(--ink-4); font-weight: 400; }
.item.sub { min-height: 34px; font-size: 14px; }
.item.sub svg.lucide { width: 14px; height: 14px; }

.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; margin: 0 4px; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); border-radius: 1px; transform: rotate(45deg); }
.dot.bad { background: var(--bad); border-radius: 1px; }
.dot.idle { box-shadow: inset 0 0 0 1.5px var(--idle); }

.ctx { margin: 2px 0 6px; }
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-4); padding: 6px 8px; border-radius: var(--r-s); background: none; border: 0; }
.back:hover { color: var(--ink); }
.switcher { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--well); text-align: left; }
.switcher:hover { border-color: var(--line-strong); }
.switcher .mark { width: 28px; height: 28px; border-radius: var(--r-s); display: grid; place-items: center; background: oklch(1 0 0 / 0.05); flex: none; }
.switcher .mark img { width: 18px; height: 18px; object-fit: contain; }
.switcher .txt { display: grid; min-width: 0; flex: 1; line-height: 1.25; }
.switcher .txt b { color: var(--ink); font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.switcher .txt .state { font-size: 12px; }

.rail-foot { padding: 10px 8px 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; flex: none; }
.account { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: var(--r-m); background: none; border: 0; text-align: left; width: 100%; }
.account:hover { background: var(--hover); }
.avatar { width: 30px; height: 30px; border-radius: var(--r-m); background: oklch(0.42 0.08 240); display: grid; place-items: center; color: var(--ink); font-weight: 600; font-size: 13px; flex: none; }
.account-text { display: grid; line-height: 1.25; min-width: 0; flex: 1; }
.account-text b { color: var(--ink); font-weight: 600; font-size: 13px; }
.account-text span { font-size: 12px; color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.is-collapsed .brand-word, .is-collapsed .rail-label, .is-collapsed .rail-sublabel, .is-collapsed .item .lbl, .is-collapsed .item .aux,
.is-collapsed .account-text, .is-collapsed .account > svg, .is-collapsed .btn-game .label, .is-collapsed .back span, .is-collapsed .switcher .txt, .is-collapsed .switcher > svg { display: none; }
.is-collapsed .rail-head { flex-direction: column; height: auto; padding: 12px 0 6px; gap: 6px; }
.is-collapsed .rail-toggle { margin: 0; }
.is-collapsed .item { justify-content: center; padding: 0; }
.is-collapsed .switcher { justify-content: center; padding: 6px; }
.is-collapsed .back { width: 100%; justify-content: center; }
.is-collapsed .btn-game { padding: 0; }
.is-collapsed .account { justify-content: center; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 15; height: var(--top); display: flex; align-items: center; gap: 14px; padding: 0 32px; border-bottom: 1px solid var(--line); background: var(--ground); }
.menu-btn { display: none; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 14px; min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; }
.crumbs > * { flex: none; }
.crumbs b { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.crumbs b { color: var(--ink); font-weight: 500; white-space: nowrap; }
.crumbs svg.lucide { width: 13px; height: 13px; }
.search-trigger { margin-left: auto; display: flex; align-items: center; gap: 10px; height: 34px; width: min(320px, 32vw); padding: 0 6px 0 11px; background: var(--well); border: 1px solid var(--line); border-radius: var(--r-m); color: var(--ink-4); }
.search-trigger:hover { border-color: var(--line-strong); color: var(--ink-3); }
.search-trigger span { flex: 1; text-align: left; font-size: 13px; }
kbd { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); padding: 1px 6px; border-radius: var(--r-s); border: 1px solid var(--line-strong); }
.stream { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-4); white-space: nowrap; }
.stream .dot { margin: 0; }

.page { padding: 32px 32px 64px; display: grid; gap: 32px; max-width: 1440px; width: 100%; }
h1, h2, h3 { margin: 0; color: var(--ink); }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.2; }
h2 { font-size: 14px; font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: var(--r-m); background: none; border: 1px solid var(--line-strong); color: var(--ink-2); font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--hover); color: var(--ink); border-color: oklch(1 0 0 / 0.22); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.chip:active, .seg button:active, .item:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.icon { width: 32px; padding: 0; }
.btn.sm { height: 30px; font-size: 13px; }
.btn.sm.icon { width: 28px; }
.btn.danger { color: var(--bad); }

.btn-game {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 34px; padding: 0 16px; border: 0; border-radius: var(--r-m);
  background: linear-gradient(var(--cyan-top), var(--cyan-bottom));
  color: var(--cyan-ink); font-weight: 800; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase;
  box-shadow: 0 4px 0 var(--cyan-lip);
  margin-bottom: 4px; white-space: nowrap;
  transition: transform 0.1s var(--ease-out), box-shadow 0.1s var(--ease-out);
}
.btn-game:active { transform: translateY(4px); box-shadow: 0 0 0 var(--cyan-lip); }
.btn-game svg.lucide { stroke-width: 2.6; width: 14px; height: 14px; }
.btn-game:disabled { filter: grayscale(0.8); opacity: 0.5; cursor: not-allowed; }
.btn-game.full { width: 100%; }

.state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.state .dot { margin: 0 2px 0 0; }
.state.ok { color: var(--ok); }
.state.warn { color: var(--warn); }
.state.bad { color: var(--bad); }
.state.idle { color: var(--ink-3); }

.lede { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
.pulse { font-family: var(--f-display); font-weight: 600; font-size: clamp(22px, 2.2vw, 28px); line-height: 1.3; color: var(--ink-4); max-width: 40ch; margin: 0; text-wrap: balance; }
.pulse em { font-style: normal; color: var(--ink); }
.pulse .w { color: var(--warn); }
.facts { margin: 8px 0 0; font-size: 13px; color: var(--ink-4); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 20px; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 0; align-items: start; }
.board > .side { border-left: 1px solid var(--line); padding-left: 28px; margin-left: 28px; display: grid; gap: 28px; }
.sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.sec-head h2 { margin-right: auto; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 2px; flex-wrap: wrap; max-width: 100%; }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: var(--r-s); background: none; color: var(--ink-3); font-size: 14px; }
.seg button:hover { color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: oklch(0.865 0.127 207 / 0.14); color: var(--ink); font-weight: 600; }
.field { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: var(--r-m); background: var(--well); border: 1px solid var(--line); color: var(--ink-4); }
.field:focus-within { border-color: oklch(0.865 0.127 207 / 0.6); }
.field input { background: none; border: 0; outline: none; width: 160px; font-size: 14px; }
.field input::placeholder { color: var(--ink-4); }

.srv-table { width: 100%; border-collapse: collapse; }
.srv-table th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.srv-table th.r, .srv-table td.r { text-align: right; }
.srv-table td { padding: 13px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.srv-table tbody tr:not(.group-row):hover { background: var(--hover); }
.srv-table tr.group-row td { padding: 18px 10px 6px; font-size: 12px; color: var(--ink-4); border-bottom: 1px solid var(--line); }
.gh { display: flex; align-items: center; gap: 8px; }
.gh img, .gh svg.lucide { width: 13px; height: 13px; object-fit: contain; }
.srv-name a { color: var(--ink); font-weight: 600; }
.srv-name a:hover { color: var(--cyan); }
.srv-name small { display: block; color: var(--ink-3); font-size: 13px; }
.reasons { display: block; margin-top: 3px; font-size: 12px; white-space: normal; }
.reason { color: var(--warn); text-decoration: underline dotted oklch(0.86 0.12 80 / 0.5); text-underline-offset: 3px; cursor: help; }
.reason.calm { color: var(--ink-4); text-decoration-color: var(--line-strong); }
.reason + .reason::before { content: ", "; color: var(--ink-4); }
.v { color: var(--ink-2); }
.of { color: var(--ink-4); }
.meter { display: grid; gap: 4px; min-width: 56px; }
.bar { height: 2px; background: oklch(1 0 0 / 0.08); }
.bar > span { display: block; height: 100%; background: var(--ink-3); }
.bar.hot > span { background: var(--warn); }
.bar.crit > span { background: var(--bad); }
.row-actions { display: flex; justify-content: flex-end; gap: 2px; visibility: hidden; }
tr:hover .row-actions, tr:focus-within .row-actions { visibility: visible; }
.empty { padding: 40px 16px; text-align: center; color: var(--ink-4); }
.empty b { display: block; color: var(--ink-2); font-weight: 600; }

.side { min-width: 0; }
.side h2 { margin-bottom: 10px; }
.side .actions { display: grid; gap: 8px; }
.side .actions.pair { grid-template-columns: 1fr 1fr; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 7px 0; font-size: 14px; line-height: 1.45; }
.feed li.fresh .ev { animation: lit 1.6s var(--ease-out); }
@keyframes lit { from { color: var(--cyan); } }
.feed time { font-size: 12px; color: var(--ink-4); padding-top: 1px; }
.feed .ev b { color: var(--ink); font-weight: 500; }
.feed .src { color: var(--ink-4); }
.feed .ban { color: var(--bad); }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
.dl dt { color: var(--ink-4); }
.dl dd { margin: 0; text-align: right; color: var(--ink-2); }
.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.jobs li { display: flex; gap: 8px; align-items: center; }
.jobs li span:last-child { margin-left: auto; color: var(--ink-4); }
.jobs .spin { animation: spin 1.2s linear infinite; color: var(--cyan); }
@keyframes spin { to { transform: rotate(360deg); } }
.link { color: var(--cyan); font-size: 12.5px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }

.node { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(0, 1.6fr) auto; gap: 28px; align-items: start; padding: 20px 0; border-bottom: 1px solid var(--line); }
.node-id b { color: var(--ink); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.node-id div { font-size: 12.5px; color: var(--ink-4); margin-top: 2px; }
.node-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.node-stats .k { font-size: 12px; color: var(--ink-4); }
.node-stats .meter { margin-top: 2px; }
.node-on { grid-column: 1 / -1; font-size: 13px; color: var(--ink-4); }
.node-on a { color: var(--ink-2); }
.node-on a:hover { color: var(--cyan); }
.node-on a + a::before { content: ", "; color: var(--ink-4); }
.log { background: var(--well); border: 1px solid var(--line); border-radius: var(--r-m); font-family: var(--f-mono); font-size: 12.5px; line-height: 1.7; padding: 14px 16px; max-height: 280px; overflow: auto; color: var(--ink-3); white-space: pre-wrap; margin: 0; }
.log .ok { color: var(--ok); }
.log .warn { color: var(--warn); }
.log .bad { color: var(--bad); }
.log .dim { color: var(--ink-4); }
.log .cmd { color: var(--cyan); }

.srv-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.srv-head .who { margin-right: auto; }
.srv-head .who .sub { margin-top: 4px; font-size: 13px; color: var(--ink-4); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.figures { display: flex; flex-wrap: wrap; gap: 8px 36px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.figures div { display: grid; }
.figures span { font-size: 12px; color: var(--ink-4); }
.figures b { font-size: 18px; font-weight: 600; color: var(--ink); }
.section-title { display: flex; align-items: baseline; gap: 10px; }
.section-title small { color: var(--ink-4); font-size: 13px; }
.console { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: min(540px, 60vh); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.console .log { border: 0; border-radius: 0; max-height: none; }
.console form { display: flex; gap: 8px; align-items: center; padding: 8px 8px 8px 14px; border-top: 1px solid var(--line); background: var(--ground-deep); }
.console form .prompt { font-family: var(--f-mono); color: var(--cyan); }
.console form input { flex: 1; background: none; border: 0; outline: none; font-family: var(--f-mono); font-size: 13px; }
.console .btn-game { margin: 0 0 4px; height: 30px; }

.later { display: grid; gap: 12px; max-width: 72ch; }
.later p { margin: 0; }
.later ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--ink-2); }
.later li::marker { color: var(--ink-4); }

.menu-pop { position: absolute; z-index: 40; min-width: 220px; padding: 4px; border-radius: var(--r-m); background: oklch(0.17 0.038 265); border: 1px solid var(--line-strong); box-shadow: 0 12px 28px -8px oklch(0 0 0 / 0.55); display: grid; }
.menu-pop button { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r-s); border: 0; background: none; text-align: left; color: var(--ink-2); font-size: 13px; }
.menu-pop button:hover, .menu-pop button:focus-visible { background: var(--select); color: var(--ink); outline: none; }
.menu-pop button.danger { color: var(--bad); }

.wz-body h2 { font-family: var(--f-display); font-size: 20px; }
.wz-foot { padding-top: 16px; border-top: 1px solid var(--line); max-width: 760px; }
.wz-foot .btn-game { margin: 0 0 4px; }
.adv summary { cursor: pointer; color: var(--ink-3); font-size: 13px; padding: 6px 0; }
.adv[open] summary { margin-bottom: 10px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pick { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.pick a { display: flex; align-items: center; gap: 16px; padding: 18px 4px; border-bottom: 1px solid var(--line); }
.pick a:hover { background: var(--hover); }
.pick a:hover svg.lucide { color: var(--cyan); transform: translateX(2px); }
.pick .mark { width: 40px; height: 40px; border-radius: var(--r-m); display: grid; place-items: center; background: oklch(1 0 0 / 0.05); flex: none; }
.pick .mark img { width: 24px; height: 24px; object-fit: contain; }
.pick span:nth-child(2) { flex: 1; display: grid; gap: 2px; }
.pick b { color: var(--ink); font-size: 15px; font-weight: 600; }
.pick small { color: var(--ink-4); font-size: 13px; }
.pick svg.lucide { transition: transform 0.15s var(--ease-out); color: var(--ink-4); }
.guide { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); font-size: 13.5px; }
.ident { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ident div { display: grid; margin-right: auto; }
.ident b { color: var(--ink); font-weight: 500; }
.ident small { color: var(--ink-4); font-size: 12px; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 76%; padding: 9px 12px; border-radius: var(--r-m); background: oklch(1 0 0 / 0.05); }
.msg.me { align-self: flex-end; border-radius: var(--r-m); background: oklch(0.80 0.13 215 / 0.13); }
.msg p { margin: 0; color: var(--ink); font-size: 13.5px; }
.msg time { display: block; font-size: 11.5px; color: var(--ink-4); margin-top: 3px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.thumb { width: 120px; height: 80px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--well); display: grid; place-items: center; align-content: center; gap: 4px; color: var(--ink-4); font-size: 11.5px; }
.thumb:hover { border-color: var(--line-strong); color: var(--ink-2); }
.composer { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.composer .btn-game { margin: 0 0 4px; }
#bare { min-height: 100vh; }
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: min(380px, 100%); display: grid; gap: 14px; }
.auth-card img { object-fit: contain; }
.auth-card h1 { font-size: 22px; font-family: var(--f-display); }
.auth-card label.f input { height: 40px; }
.auth-card .btn.full { width: 100%; height: 38px; }
.auth-card .btn-game.full { height: 40px; }
.turnstile { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-m); font-size: 12.5px; color: var(--ink-3); }
.rules-page { max-width: 760px; margin: 0 auto; padding: 48px 20px 64px; display: grid; gap: 28px; }
.rules-page header { display: flex; gap: 14px; align-items: center; }
.rules-page h1 { font-family: var(--f-display); font-size: 26px; }
.rules-page h2 { font-size: 15px; margin-bottom: 6px; }
.rules-page ol { list-style: none; margin: 0; padding: 0; }
.rules-page li { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.rules-page li p { margin: 0; color: var(--ink); }
.rules-page li small { color: var(--ink-4); }
@media (max-width: 1180px) {
  .charts.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols2, .cols2.wide-left { grid-template-columns: minmax(0, 1fr); }
  .cols2.wide-left > aside { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 20px; }
  .form-grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .charts, .charts.three { grid-template-columns: minmax(0, 1fr); }
  .split { grid-template-columns: minmax(0, 1fr); }
  .split > .list { border-right: 0; border-bottom: 1px solid var(--line); max-height: 300px; }
  .split > .detail { padding: 16px 0; max-height: none; }
  .wizard { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .steps.vertical { position: static; flex-direction: row; flex-wrap: wrap; }
  .cfg-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .form-grid.four { grid-template-columns: minmax(0, 1fr); }
  .tl li { grid-template-columns: 44px minmax(0, 1fr); }
  .tl li .kind { display: none; }
  .setrow { flex-wrap: wrap; gap: 10px; }
  .inv { grid-template-columns: repeat(9, minmax(0, 1fr)); }
  .inv span { width: auto; aspect-ratio: 1; height: auto; }
  .hide-sm { display: none; }
  .dt .row-actions { visibility: visible; }
}
@media (max-width: 1400px) { .col-uptime { display: none; } }
@media (max-width: 1180px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .board > .side { border-left: 0; padding-left: 0; margin-left: 0; border-top: 1px solid var(--line); padding-top: 24px; margin-top: 24px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .node { grid-template-columns: 1fr; gap: 14px; }
}
@media (max-width: 860px) {
  .app, .app.is-collapsed { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; left: 0; top: 0; width: 284px; transform: translateX(-102%); transition: transform 0.26s var(--ease-out); }
  .app.drawer-open .rail { transform: none; box-shadow: 24px 0 48px oklch(0 0 0 / 0.5); }
  .drawer-scrim { position: fixed; inset: 0; z-index: 19; background: oklch(0.08 0.03 265 / 0.6); }
  .rail-toggle { display: none; }
  .menu-btn { display: grid; }
  .topbar { padding: 0 16px; gap: 10px; }
  .search-trigger { width: 34px; padding: 0; justify-content: center; }
  .search-trigger span, .search-trigger kbd, .stream .long { display: none; }
  .crumbs > :not(b) { display: none; }
  .page { padding: 20px 16px 48px; gap: 24px; }
  .node-stats { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .srv-table thead { display: none; }
  .srv-table, .srv-table tbody { display: block; }
  .srv-table tr { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .srv-table tr.group-row { display: block; padding: 18px 0 0; border-bottom: 0; }
  .srv-table td { padding: 0; border: 0; white-space: normal; }
  .srv-table tr.group-row td { padding: 0 0 6px; }
  .srv-table td.col-uptime { display: none; }
  .srv-table td.col-name { grid-column: 1 / 4; }
  .srv-table td.col-state { grid-column: 4; justify-self: end; }
  .srv-table td.col-actions { grid-column: 1 / -1; }
  .srv-table td.r { text-align: left; }
  .row-actions { visibility: visible; justify-content: flex-start; }
  .srv-table td[data-label]::before { content: attr(data-label); display: block; font-size: 11.5px; color: var(--ink-4); }
  .toasts { left: 16px; right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Ana gezinme"></aside>
  <div class="main">
    <header class="topbar">
      <button class="btn icon ghost menu-btn" id="menuBtn" aria-label="Menüyü aç"><i data-lucide="menu"></i></button>
      <nav class="crumbs" id="crumbs" aria-label="Konum"></nav>
      <button class="search-trigger" id="searchBtn" aria-label="Komut paletini aç">
        <i data-lucide="search"></i><span>Ara veya komut çalıştır</span><kbd>Ctrl K</kbd>
      </button>
      <div class="stream" role="status"><span class="dot ok"></span><span>Canlı<span class="long" id="streamAgo"></span></span></div>
    </header>
    <main class="page" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="bare" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="layer"></div>

<script src="screens.js"></script>
<script>
const DATA = {
  user: { name: "Aydoğan", email: "owner@arkonas.net", role: "Sahip" },
  nodes: [
    { id: "main", name: "arkonas-main", host: "203.0.113.21", agent: "0.42.1", state: "ok", seen: "3 sn önce", cpu: 46, cores: 16, ram: 71, ramTotal: "15 GB", disk: 58, diskTotal: "960 GB", os: "Ubuntu 24.04" },
    { id: "proxy", name: "arkonas-proxy", host: "198.51.100.7", agent: "0.42.1", state: "ok", seen: "4 sn önce", cpu: 12, cores: 4, ram: 38, ramTotal: "8 GB", disk: 21, diskTotal: "160 GB", os: "Debian 12" }
  ],
  servers: [
    { id: "smp", name: "Arkonas SMP", game: "minecraft", kind: "Paper 1.21.8", node: "main", state: "ok", players: 28, max: 200, tps: 19.9, cpu: 41, ram: 82, ramText: "9,8 / 12 GB", uptime: "3g 4s", reasons: [], mod: true },
    { id: "skyblock", name: "Skyblock", game: "minecraft", kind: "Paper 1.21.8", node: "main", state: "warn", players: 11, max: 150, tps: 17.6, cpu: 88, ram: 71, ramText: "7,1 / 10 GB", uptime: "19s", reasons: ["CPU %88", "Yedek yok"], mod: true },
    { id: "lobby", name: "Lobby", game: "minecraft", kind: "Paper 1.21.8", node: "main", state: "ok", players: 2, max: 300, tps: 20.0, cpu: 6, ram: 34, ramText: "1,4 / 4 GB", uptime: "6g 2s", reasons: [], mod: true },
    { id: "velocity", name: "Velocity", game: "minecraft", kind: "Velocity 3.6 proxy", node: "proxy", state: "ok", players: 41, max: 500, tps: null, cpu: 9, ram: 22, ramText: "0,9 / 4 GB", uptime: "11g", reasons: [], mod: false },
    { id: "dev", name: "Dev Test", game: "minecraft", kind: "Paper 1.21.8, Docker", node: "main", state: "idle", players: 0, max: 20, tps: null, cpu: 0, ram: 0, ramText: "-", uptime: "-", reasons: ["Beklenen kapanış"], mod: false },
    { id: "squad1", name: "Arkonas Squad #1", game: "squad", kind: "Squad Invasion/RAAS", node: "main", state: "ok", players: 64, max: 100, tps: null, fps: 48, cpu: 63, ram: 49, ramText: "7,8 / 16 GB", uptime: "1g 7s", reasons: [], mod: true },
    { id: "arma", name: "Reforger Test", game: "arma", kind: "Arma Reforger", node: "main", state: "bad", players: 0, max: 64, tps: null, cpu: 0, ram: 0, ramText: "-", uptime: "-", reasons: ["Beklenmedik kapanış", "Toplayıcı çevrimdışı"], mod: false }
  ],
  jobs: [
    { label: "Skyblock yedeği", detail: "kuyrukta", running: false },
    { label: "SMP dünya optimizasyonu", detail: "%62", running: true }
  ],
  games: {
    minecraft: { label: "Minecraft", logo: "assets/minecraft.svg" },
    squad: { label: "Squad", logo: "assets/squad.png" },
    arma: { label: "Arma Reforger", logo: null, icon: "crosshair" }
  }
};

const MC_MOD = [
  ["operations", "Operasyon", "activity", 0], ["coreprotect", "CoreProtect", "history", 0], ["auctions", "İhaleler", "gavel", 14],
  ["profiles", "Profiller", "search", 0], ["anticheat", "Anticheat", "shield-alert", 3], ["economy", "Ekonomi & Oy", "coins", 0],
  ["roles", "Roller", "shield", 0], ["punishments", "Cezalar", "gavel", 2], ["plugins", "Pluginler", "package", 0]
];
const SQUAD_MOD = [
  { label: "Sunucu", items: [["dashboard", "Dashboard", "house"], ["stats", "Server Stats", "chart-column"], ["layerChanges", "Layer Changes", "layers"], ["layerHistory", "Layer History", "layers"], ["players", "Player List", "users"]] },
  { label: "Yetki", items: [["admins", "Server Admins", "crown"], ["whitelist", "Whitelist Manager", "user-check"], ["filter", "Filtering System", "list-filter"], ["rules", "Server Rules", "scroll-text"]] },
  { label: "Ara", items: [["searchPlayers", "Search Players", "search"], ["searchSquads", "Search Squads", "binoculars"], ["requests", "Admin Requests", "shield-alert"]] },
  { label: "Operasyon", items: [["seedSettings", "Seed Settings", "sprout"], ["seedManager", "Seed Manager", "activity"], ["tickets", "Ticket System", "ticket"], ["plugins", "Plugin Manager", "plug"], ["flags", "Flag Manager", "flag"], ["bans", "Ban Manager", "ban"], ["slban", "SLBan Manager", "crown"]] }
];
const GENEL = [["konsol", "Konsol", "square-terminal"], ["telemetri", "Telemetri", "activity"]];
const SISTEM = [["dosyalar", "Dosyalar", "folder-open"], ["yapilandirma", "Yapılandırma", "file-sliders"], ["network", "Network", "network"], ["gorevler", "Görevler", "calendar-clock"]];


const REASON_DETAIL = {
  "Yedek yok": "Bu sunucu için panelin aldığı bir yedek yok. Riskli yaşam döngüsü veya güncelleme işinden önce yedek alın.",
  "Beklenmedik kapanış": "Canlı telemetri sunucuyu kapalı gösteriyor ama beklenen bir kapanış olarak işaretlenmemiş.",
  "Toplayıcı çevrimdışı": "Telemetri toplayıcısı bu sunucu için veri göndermiyor; canlı durum bayat olabilir.",
  "Beklenen kapanış": "Sunucu bilerek durduruldu; operatör aksiyonu gerekmiyor."
};
function reasonDetail(r) { return REASON_DETAIL[r] || (r.startsWith("CPU") ? "Anlık CPU baskısı bu sunucu için inceleme eşiğinin üstünde." : "Canlı durum puanlama modeli bu sinyali yükseltti."); }

const STATE = { ok: "Çalışıyor", warn: "İzlenmeli", bad: "Kapalı", idle: "Durduruldu" };

const FEED_SEED = [
  ["SMP", "<b>deniz_07</b> katıldı"], ["Squad #1", "Harita: <b>Narva RAAS v1</b>"], ["Skyblock", "<b>Kaanx</b> /is warp maden"],
  ["SMP", "<span class='ban'>Ban</span> <b>griefer_tr</b>, 7 gün, Mert"], ["Velocity", "<b>41</b> bağlı oyuncu"], ["Skyblock", "CPU eşiği aşıldı"]
];
const FEED_POOL = [
  ["SMP", "<b>yagmur.k</b> katıldı"], ["Lobby", "<b>Efe_Can</b> SMP'ye geçti"], ["Squad #1", "<b>[TR] Bora</b> takım değiştirdi"],
  ["Skyblock", "<b>Kaanx</b> ihaleye 3 eşya koydu"], ["SMP", "<b>mavi_kedi</b> ayrıldı"], ["Skyblock", "<span class='ban'>Mute</span> <b>spamci</b>, 1 saat"]
];

let feed = FEED_SEED.map((e, i) => ({ t: clock(-(i * 47 + 12)), src: e[0], html: e[1], fresh: false }));
let filters = { game: "all", q: "" };
let collapsed = false;
const groupState = {};
let streamTick = 0;

function clock(o = 0) { return new Date(Date.now() + o * 1000).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" }); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function icons() { if (window.lucide) lucide.createIcons(); }
function node(id) { return DATA.nodes.find(n => n.id === id); }
function server(id) { return DATA.servers.find(s => s.id === id); }
function isOn(s) { return s.state === "ok" || s.state === "warn"; }
function gameMark(k) { const g = DATA.games[k]; return g.logo ? `<img src="${g.logo}" alt="">` : `<i data-lucide="${g.icon}"></i>`; }
function stateText(st) { return `<span class="state ${st}"><span class="dot ${st}" aria-hidden="true"></span>${STATE[st]}</span>`; }
function barClass(v) { return v >= 85 ? "crit" : v >= 70 ? "hot" : ""; }
function meter(v, text, title) { return `<div class="meter"${title ? ` title="${esc(title)}"` : ""}><span class="v">${text}</span><div class="bar ${barClass(v)}"><span style="width:${v}%"></span></div></div>`; }
function defaultSection(s) { return s.mod ? (s.game === "squad" ? "mod-dashboard" : "mod-operations") : "konsol"; }
function sectionLabel(s, sec) {
  const g = [...GENEL, ...SISTEM].find(x => x[0] === sec); if (g) return g[1];
  if (sec.startsWith("mod-")) { const k = sec.slice(4); const it = s.game === "squad" ? SQUAD_MOD.flatMap(x => x.items).find(x => x[0] === k) : MC_MOD.find(x => x[0] === k); return it ? it[1] : "Moderasyon"; }
  return "Konsol";
}

function railItem(href, label, icon, opts = {}) {
  const cur = opts.current ? (opts.tab ? 'aria-selected="true"' : 'aria-current="page"') : (opts.tab ? 'aria-selected="false"' : "");
  const lead = opts.dot ? `<span class="dot ${opts.dot}" aria-hidden="true"></span>` : `<i data-lucide="${icon}"></i>`;
  return `<a class="item${opts.sub ? " sub" : ""}" href="${href}" ${opts.tab ? 'role="tab"' : ""} ${cur} title="${esc(opts.title || label)}">${lead}<span class="lbl">${esc(label)}</span>${opts.aux !== undefined && opts.aux !== "" ? `<span class="aux">${opts.aux}</span>` : ""}</a>`;
}

function renderRail(route) {
  const main = [["dashboard", "Dashboard", "layout-dashboard", ""], ["nodelar", "Nodelar", "server", DATA.nodes.length], ["denetim", "Denetim", "user-cog", ""], ["destek", "Destek", "life-buoy", 3]];
  let html = main.map(([k, l, ic, c]) => railItem(`#/${k}`, l, ic, { current: route.name === k && !(k === "denetim"), aux: c }) + (k === "denetim" && route.name === "denetim" ? AUDIT_SECTIONS.map(([sk, sl, si]) => railItem(`#/denetim/${sk}`, sl, si, { sub: true, current: (route.id || "kullanicilar") === sk })).join("") : "")).join("");
  html += `<div class="rail-sep"></div>`;

  if (route.name === "sunucu" && server(route.id)) {
    const s = server(route.id);
    const sec = route.sec || defaultSection(s);
    const base = `#/sunucu/${s.id}/`;
    html += `<div class="ctx">
      <a class="back" href="#/dashboard" title="Tüm sunucular"><i data-lucide="arrow-left"></i><span>Tüm sunucular</span></a>
      <button class="switcher" id="switcher" aria-haspopup="menu" title="Sunucu değiştir">
        <span class="mark">${gameMark(s.game)}</span>
        <span class="txt"><b>${esc(s.name)}</b>${stateText(s.state)}</span>
        <i data-lucide="chevrons-up-down"></i>
      </button></div>
      <nav role="tablist" aria-orientation="vertical" aria-label="Sunucu bölümleri">`;
    html += `<div class="rail-label">Genel</div>` + GENEL.map(([k, l, ic]) => railItem(base + k, l, ic, { tab: true, current: sec === k })).join("");
    html += `<div class="rail-label">Sistem</div>` + SISTEM.map(([k, l, ic]) => railItem(base + k, l, ic, { tab: true, current: sec === k })).join("");
    if (s.mod) {
      html += `<div class="rail-label">Moderasyon</div>`;
      if (s.game === "squad") {
        html += SQUAD_MOD.map(g => {
          const key = `${s.id}:${g.label}`;
          const hasCur = g.items.some(([k]) => sec === "mod-" + k);
          const open = key in groupState ? groupState[key] : hasCur;
          return `<button type="button" class="grp-toggle${hasCur ? " has-cur" : ""}" data-grp="${esc(key)}" aria-expanded="${open}"><i data-lucide="chevron-right"></i><span class="lbl">${g.label}</span><span class="aux">${g.items.length}</span></button>`
            + (open ? g.items.map(([k, l, ic]) => railItem(base + "mod-" + k, l, ic, { tab: true, sub: true, current: sec === "mod-" + k })).join("") : "");
        }).join("");
      } else {
        html += MC_MOD.map(([k, l, ic, n]) => railItem(base + "mod-" + k, l, ic, { tab: true, sub: true, current: sec === "mod-" + k, aux: n || "" })).join("");
      }
    }
    html += `</nav>`;
  } else {
    const running = DATA.servers.filter(isOn).length;
    html += `<div class="rail-label"><span>Sunucular</span><span>${running}/${DATA.servers.length}</span></div>`;
    html += Object.entries(DATA.games).map(([key, g]) => {
      const list = DATA.servers.filter(s => s.game === key);
      if (!list.length) return "";
      return `<div class="rail-sublabel" style="padding-left:8px">${g.label}</div>` + list.map(s =>
        railItem(`#/sunucu/${s.id}`, s.name, "", { dot: s.state, aux: isOn(s) ? s.players : "", title: `${s.name}, ${STATE[s.state]}` })).join("");
    }).join("");
  }

  document.getElementById("rail").innerHTML = `
    <div class="rail-head">
      <a class="brand" href="#/dashboard" aria-label="Arkonas Panel"><img src="assets/arkonas-logo.png" alt=""><span class="brand-word"><b>ARKONAS</b><span>Operasyon paneli</span></span></a>
      <button class="rail-toggle" id="railToggle" aria-label="${collapsed ? "Sidebar'ı genişlet" : "Sidebar'ı daralt"}"><i data-lucide="${collapsed ? "panel-left-open" : "panel-left-close"}"></i></button>
    </div>
    <div class="rail-body">${html}</div>
    <div class="rail-foot">
      <a class="btn-game full" href="#/yeni" title="Yeni sunucu"><i data-lucide="plus"></i><span class="label">Yeni sunucu</span></a>
      <button class="account" id="accountBtn" aria-haspopup="menu"><span class="avatar">A</span><span class="account-text"><b>${DATA.user.name}</b><span>${DATA.user.email}</span></span><i data-lucide="settings"></i></button>
    </div>`;
  document.getElementById("railToggle").onclick = () => { collapsed = !collapsed; document.getElementById("app").classList.toggle("is-collapsed", collapsed); renderRail(parseRoute()); icons(); };

let lastFocus = null;
function openLayer(html, onMount) {
  lastFocus = document.activeElement;
  document.getElementById("layer").innerHTML = `<div class="scrim" id="scrim">${html}</div>`;
  const scrim = document.getElementById("scrim");
  scrim.addEventListener("mousedown", e => { if (e.target === scrim) closeLayer(); });
  scrim.addEventListener("keydown", trapFocus);
  icons();
  onMount && onMount(scrim);
  const first = scrim.querySelector("input, button");
  first && first.focus();
}
function closeLayer() { document.getElementById("layer").innerHTML = ""; lastFocus && lastFocus.focus && lastFocus.focus(); }
function trapFocus(e) {
  if (e.key === "Escape") { e.preventDefault(); closeLayer(); return; }
  if (e.key !== "Tab") return;
  const f = [...e.currentTarget.querySelectorAll("button, input, select, a[href]")].filter(x => !x.disabled);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function confirmDialog(title, body, cta, fn, danger) {
  openLayer(`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="cdT">
    <div class="dialog-head"><div><h2 id="cdT">${esc(title)}</h2><p>${esc(body)}</p></div></div>
    <div class="dialog-foot"><button class="btn ghost" id="cdNo">Vazgeç</button>${danger ? `<button class="btn danger" id="cdYes">${esc(cta)}</button>` : `<button class="btn-game" id="cdYes">${esc(cta)}</button>`}</div></div>`, () => {
    document.getElementById("cdNo").onclick = closeLayer;
    document.getElementById("cdYes").onclick = () => { closeLayer(); fn(); };
    setTimeout(() => document.getElementById("cdNo").focus(), 0);
  });
}

function openMenu(anchor, items, align) {
  closeMenu();
  const r = anchor.getBoundingClientRect();
  const m = document.createElement("div");
  m.className = "menu-pop"; m.id = "menuPop"; m.setAttribute("role", "menu");
  m.innerHTML = items.map((it, i) => !it ? "<hr>" : !it[2] ? `<div class="mlabel">${esc(it[1])}</div>` : `<button role="menuitem" data-i="${i}" class="${it[3] || ""}"><i data-lucide="${it[0]}"></i>${esc(it[1])}${it[4] ? `<span class="aux">${esc(it[4])}</span>` : ""}</button>`).join("");
  document.body.appendChild(m);
  icons();
  const w = m.offsetWidth, h = m.offsetHeight;
  let left = align === "left" ? r.left : r.right - w;
  left = Math.max(12, Math.min(left, innerWidth - w - 12));
  let top = r.bottom + 6; if (top + h > innerHeight - 12) top = r.top - h - 6;
  m.style.left = left + scrollX + "px"; m.style.top = top + scrollY + "px";
  m.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { closeMenu(); items[+b.dataset.i][2](); });
  m.addEventListener("keydown", e => {
    const btns = [...m.querySelectorAll("button")]; const i = btns.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); btns[(i + 1) % btns.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
    if (e.key === "Escape") { closeMenu(); anchor.focus(); }
  });
  m.querySelector("button").focus();
  setTimeout(() => document.addEventListener("mousedown", outside), 0);
  function outside(e) { if (!m.contains(e.target)) { closeMenu(); document.removeEventListener("mousedown", outside); } }
}
function closeMenu() { document.getElementById("menuPop")?.remove(); }

    .map(([k, l, ic]) => ({ grp: "Git", label: l, icon: ic, hint: "", run: () => location.hash = `#/${k}` }));
  DATA.servers.forEach(s => {
    items.push({ grp: "Sunucular", label: s.name, icon: "server", hint: STATE[s.state], run: () => location.hash = `#/sunucu/${s.id}` });
    const secs = [...GENEL, ...(s.mod ? (s.game === "squad" ? SQUAD_MOD.flatMap(g => g.items) : MC_MOD).map(x => ["mod-" + x[0], x[1], x[2]]) : []), ...SISTEM];
    secs.forEach(([k, l, ic]) => items.push({ grp: "Sunucu bölümleri", label: `${s.name} › ${l}`, icon: ic, hint: "", run: () => location.hash = `#/sunucu/${s.id}/${k}`, quiet: true }));

                       : { grp: "İşlemler", label: `${s.name} başlat`, icon: "play", hint: "", run: () => serverAction("start", s.id), quiet: true });
  });
  items.push({ grp: "İşlemler", label: "Sunucuları tara", icon: "radar", hint: "", run: openScan });
  items.push({ grp: "İşlemler", label: "Yeni sunucu oluştur", icon: "plus", hint: "", run: () => location.hash = "#/yeni" });
  items.push({ grp: "İşlemler", label: "Node hazırla", icon: "hard-drive-download", hint: "", run: () => { location.hash = "#/nodelar"; setTimeout(openBootstrap, 50); } });
  items.push({ grp: "İşlemler", label: "Profil ayarları", icon: "user-round-cog", hint: "", run: openProfile });
  AUDIT_SECTIONS.forEach(([k, l, ic]) => items.push({ grp: "Git", label: `Denetim › ${l}`, icon: ic, hint: "", run: () => location.hash = `#/denetim/${k}`, quiet: true }));
  Object.entries(WIZ).forEach(([k, w]) => items.push({ grp: "İşlemler", label: `Yeni ${w.label} sunucusu`, icon: "plus", hint: "", run: () => location.hash = `#/yeni/${k}`, quiet: true }));

function norm(s) { return s.toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ı/g, "i"); }
function matchScore(label, q) {
  if (!q) return 1;
  const L = norm(label); let score = 0;
  for (const w of norm(q).split(/\s+/).filter(Boolean)) { const i = L.indexOf(w); if (i < 0) return 0; score += i === 0 ? 3 : L[i - 1] === " " ? 2 : 1; }
  return score;
}
function highlight(label, q) {
  let out = esc(label);
  if (!q) return out;
  norm(q).split(/\s+/).filter(Boolean).forEach(w => { const i = norm(label).indexOf(w); if (i >= 0) { const seg = label.slice(i, i + w.length); out = out.replace(esc(seg), `<mark>${esc(seg)}</mark>`); } });
  return out;
}
function openPalette() {
  const all = paletteItems();
  let sel = 0, shown = [];
  openLayer(`<div class="dialog palette" role="dialog" aria-modal="true" aria-label="Komut paleti">
    <div class="palette-input"><i data-lucide="search"></i><input id="pIn" role="combobox" aria-expanded="true" aria-controls="pList" placeholder="Sunucu, bölüm veya işlem, örn. sky cezalar" autocomplete="off"><kbd>Esc</kbd></div>
    <ul class="palette-list" id="pList" role="listbox"></ul>
    <div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> gez</span><span><kbd>Enter</kbd> çalıştır</span></div></div>`, () => {
    const inp = document.getElementById("pIn"), list = document.getElementById("pList");
    function draw() {
      const q = inp.value.trim();
      shown = all.map(it => ({ it, s: matchScore(it.label, q) })).filter(x => x.s > 0 && (q || !x.it.quiet)).sort((a, b) => q ? b.s - a.s : 0).slice(0, 40).map(x => x.it);
      if (q) { const order = []; shown.forEach(i => { if (!order.includes(i.grp)) order.push(i.grp); }); shown.sort((a, b) => order.indexOf(a.grp) - order.indexOf(b.grp)); }
      sel = Math.min(sel, Math.max(0, shown.length - 1));
      let g = "";
      list.innerHTML = shown.length ? shown.map((it, i) => { const head = it.grp !== g ? `<li class="grp" role="presentation">${it.grp}</li>` : ""; g = it.grp; return head + `<li class="opt" role="option" id="po${i}" data-i="${i}" aria-selected="${i === sel}"><i data-lucide="${it.icon}"></i><span>${highlight(it.label, q)}</span><small>${it.hint}</small></li>`; }).join("") : `<li class="empty"><b>Sonuç yok</b>Başka bir kelime dene: smp, tara, cezalar.</li>`;
      inp.setAttribute("aria-activedescendant", shown.length ? `po${sel}` : "");
      icons();
      list.querySelectorAll(".opt").forEach(o => { o.onmousemove = () => { if (sel !== +o.dataset.i) { sel = +o.dataset.i; mark(); } }; o.onclick = () => run(+o.dataset.i); });
    }
    function mark() { list.querySelectorAll(".opt").forEach(o => o.setAttribute("aria-selected", +o.dataset.i === sel)); document.getElementById(`po${sel}`)?.scrollIntoView({ block: "nearest" }); inp.setAttribute("aria-activedescendant", `po${sel}`); }
    function run(i) { const it = shown[i]; if (!it) return; closeLayer(); setTimeout(it.run, 10); }
    inp.oninput = () => { sel = 0; draw(); };
    inp.onkeydown = e => {
      if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, shown.length - 1); mark(); }
      if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); mark(); }
      if (e.key === "Enter") { e.preventDefault(); run(sel); }
    };
    draw();
  });
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = `<i data-lucide="check"></i><span>${esc(msg)}</span>`;
  document.getElementById("toasts").appendChild(t);
  icons();
  setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, 3000);
}

function parseRoute() {
  const p = (location.hash || "#/dashboard").slice(2).split("/");
  return { name: p[0] || "dashboard", id: p[1], sec: p[2] };
}
function route() {
  const r = parseRoute();
  closeMenu();
  document.getElementById("app").classList.remove("drawer-open");
  document.querySelector(".drawer-scrim")?.remove();
  const bare = BARE[r.name];
  document.getElementById("app").hidden = !!bare;
  document.getElementById("bare").hidden = !bare;
  if (bare) { document.getElementById("bare").innerHTML = bare(r.id); icons(); return; }
  renderRail(r);
  if (r.name === "dashboard") viewDashboard();
  else if (r.name === "nodelar") viewNodes();
  else if (r.name === "sunucu") viewServer(r.id, r.sec);
  else if (AREA_SCREENS[r.name]) viewArea(r.name, r.id);
  else { location.hash = "#/dashboard"; return; }
  icons();
}
